name: compute preview

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_type == 'branch' && !github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Bun
        env:
          BUN_VERSION: 1.3.12
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      # The action selects production for the default branch and otherwise uses
      # the exact branch name as its stage. The Git connection supplies OIDC.
      - name: Deploy Studio
        id: deploy
        uses: prisma/cloud-deploy-action@8cef831d59df59dde55117e5119a3bef060b3bd2 # v1
        with:
          module: module.ts
          install-command: pnpm install --frozen-lockfile
          build-command: pnpm build:deploy
      - name: Require a completed deployment
        if: steps.deploy.outputs.outcome != 'succeeded'
        run: |
          echo "::error::Studio was not deployed. Connect prisma/studio to the Prisma project and grant this workflow OIDC access."
          exit 1

      - name: Verify demo startup
        if: steps.deploy.outputs.outcome == 'succeeded'
        env:
          PREVIEW_SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 \
            "${PREVIEW_SERVICE_URL}/api/config" | node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const config = JSON.parse(readFileSync(0, "utf8"));
              if (typeof config.bootId !== "string" || config.streams?.url !== "/api/streams") {
                throw new Error("The deployed Studio demo did not return its database and Streams configuration.");
              }
            '

      - name: Comment preview URL on PR
        if: steps.deploy.outputs.outcome == 'succeeded' && github.ref_name != github.event.repository.default_branch
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_BRANCH_NAME: ${{ github.ref_name }}
          PREVIEW_SERVICE_NAME: studio
          PREVIEW_SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/compute-preview/compute-preview-comment.mjs
